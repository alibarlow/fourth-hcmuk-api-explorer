<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fourth API Explorer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#1a1a2e;font-size:14px;line-height:1.5}

/* ── Header ── */
.header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:10px 24px;display:flex;align-items:center;gap:16px}
.header-brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.header-logo{width:30px;height:30px;background:#0f4c81;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;flex-shrink:0}
.header-title{font-size:16px;font-weight:700;color:#111827}
.search-wrap{flex:1;max-width:420px;position:relative}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9ca3af;pointer-events:none}
.search-input{width:100%;padding:7px 12px 7px 34px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;color:#111827}
.search-input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.search-input::placeholder{color:#9ca3af}

/* ── Tabs ── */
.tabs{padding:0 24px;border-bottom:2px solid #e5e7eb;display:flex;gap:0;background:#fff}
.tab-btn{padding:14px 28px;border:none;border-bottom:3px solid transparent;background:transparent;color:#6b7280;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit;margin-bottom:-2px}
.tab-btn:hover{color:#111827}
.tab-btn.active{color:#111827;border-bottom-color:#111827}

/* ── Product filter ── */
.product-filter{padding:8px 24px 6px;display:flex;gap:6px;background:#fff;border-bottom:1px solid #f3f4f6}
.prod-btn{padding:3px 13px;border:1px solid #d1d5db;border-radius:20px;background:#fff;color:#6b7280;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;line-height:1.6}
.prod-btn:hover{border-color:#9ca3af;color:#374151;background:#f9fafb}
.prod-btn.active{background:#111827;border-color:#111827;color:#fff}

/* ── Stats ── */
.stats{padding:8px 24px;border-bottom:1px solid #f3f4f6;display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:#fafafa}
.stat-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#6b7280}
.stat-count{font-weight:700;color:#111827;font-size:14px}
.stat-sep{color:#d1d5db}

/* ── Content ── */
.content{padding:18px 24px;max-width:1060px;margin:0 auto}

/* ── API Card ── */
.api-card{border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}
.api-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.api-card.exp-open{border-left:3px solid #22c55e}
.api-card.exp-emp{border-left:3px solid #3b82f6}
.api-card.exp-int{border-left:3px solid #9ca3af}
.api-card.exp-client{border-left:3px solid #f59e0b}

.api-header{padding:13px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;background:#fafafa;user-select:none;transition:background .12s}
.api-header:hover{background:#f3f4f6}
.api-icon{font-size:22px;flex-shrink:0;width:34px;text-align:center}
.api-meta{flex:1;min-width:0}
.api-title-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.api-title{font-size:14px;font-weight:700;color:#111827}
.api-subtitle{font-size:12px;color:#6b7280;margin-top:2px}
.api-expose-note{font-size:11px;color:#9ca3af;margin-top:1px}
.api-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.ep-count{font-size:12px;color:#9ca3af;white-space:nowrap}
.chevron{width:16px;height:16px;color:#9ca3af;transition:transform .2s;flex-shrink:0}
.api-card.open .chevron{transform:rotate(180deg)}

/* ── Exposure badges ── */
.badge-exp{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.exp-open-badge{background:#dcfce7;color:#166534}
.exp-emp-badge{background:#dbeafe;color:#1e40af}
.exp-int-badge{background:#f3f4f6;color:#4b5563}
.exp-client-badge{background:#fef3c7;color:#92400e}

/* ── API Body ── */
.api-body{display:none;padding:0 16px 14px 16px}
.api-card.open .api-body{display:block}

/* ── Groups ── */
.group-heading{font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#374151;padding:12px 0 5px;border-bottom:1px solid #e5e7eb;margin-bottom:2px}
/* ── Section header ── */
.section-header{padding:18px 0 10px;font-size:20px;font-weight:700;color:#111827;border-bottom:2px solid #e5e7eb;margin-bottom:16px}

/* ── Endpoints ── */
.endpoint{padding:8px 0;border-bottom:1px solid #f9fafb}
.endpoint:last-child{border-bottom:none}
.ep-row{display:flex;align-items:flex-start;gap:9px}
.ep-info{flex:1;min-width:0}
.ep-name{font-size:13px;font-weight:600;color:#111827}
.ep-desc{font-size:12px;color:#6b7280;margin-top:1px}
.ep-path{font-family:'SF Mono',Consolas,monospace;font-size:11px;color:#9ca3af}
.ep-path-row{display:flex;align-items:center;gap:6px;margin-top:3px}

/* ── Method badges ── */
.method{display:inline-flex;align-items:center;justify-content:center;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:.04em;flex-shrink:0;min-width:52px;margin-top:2px}
.m-GET{background:#dcfce7;color:#166534}
.m-POST{background:#dbeafe;color:#1e40af}
.m-PATCH{background:#fef3c7;color:#92400e}
.m-PUT{background:#ccfbf1;color:#134e4a}
.m-DELETE{background:#fee2e2;color:#991b1b}
.m-EVENT{background:#ede9fe;color:#5b21b6}
.m-QUERY{background:#fce7f3;color:#9d174d}

/* ── Field tabs ── */
.ep-tabs{display:flex;gap:6px;margin-top:8px}
.ep-tab{padding:2px 10px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;font-size:11px;color:#6b7280;cursor:pointer;font-family:inherit;transition:all .15s;font-weight:500;white-space:nowrap;line-height:1.6}
.ep-tab:hover{border-color:#d1d5db;color:#374151;background:#f9fafb}
.ep-tab.active{background:#1a1a2e;border-color:#1a1a2e;color:#fff}

/* ── Response note ── */
.response-note{font-size:12px;color:#374151;padding:7px 10px;background:#f8fafc;border:1px solid #e5e7eb;border-left:3px solid #9ca3af;border-radius:4px;margin-bottom:6px;line-height:1.5}

/* ── Fields empty message ── */
.fields-empty{font-size:12px;color:#9ca3af;padding:6px 2px;font-style:italic}

/* ── Fields table ── */
.fields-wrap{display:none;margin-top:8px}
.fields-wrap.open{display:block}
.fields-table{width:100%;border-collapse:collapse;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden}
.fields-table th{background:#f9fafb;padding:5px 10px;text-align:left;font-weight:600;color:#6b7280;border-bottom:1px solid #e5e7eb;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.fields-table th:first-child{width:25%}
.fields-table th:nth-child(2){width:13%}
.fields-table th:nth-child(3){width:12%}
.fields-table-res th:first-child{width:30%}
.fields-table-res th:nth-child(2){width:16%}
.fields-table td{padding:5px 10px;border-bottom:1px solid #f3f4f6;vertical-align:top;color:#374151}
.fields-table td:nth-child(2){font-size:11px;color:#374151;white-space:nowrap}
.fields-table tr:last-child td{border-bottom:none}
.fields-table tr:hover td{background:#fafafa}
.field-name{font-family:'SF Mono',Consolas,monospace;font-size:11px;color:#1f2937}
.field-desc{font-size:12px;color:#6b7280}

/* ── Field badges ── */
.badge-field{display:inline-flex;align-items:center;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:600;white-space:nowrap}
.f-required{background:#dcfce7;color:#166534}
.f-optional{background:#f3f4f6;color:#6b7280}
.f-readonly{background:#dbeafe;color:#1e40af}
.f-system{background:#e2e8f0;color:#475569}
.f-conditional{background:#fef3c7;color:#92400e}
.field-note-row td{padding:5px 8px;font-size:11px;color:#6b7280;font-style:italic;background:#fafafa;border-bottom:1px solid #f3f4f6}
.field-section-row td{padding:5px 8px;font-size:11px;font-weight:700;color:#374151;background:#f3f4f6;border-top:2px solid #e5e7eb;border-bottom:1px solid #e5e7eb;letter-spacing:.03em;text-transform:uppercase}
.field-sub-row td:first-child .field-name{padding-left:16px;display:inline-block;color:#374151}

/* ── No results ── */
.no-results{text-align:center;padding:56px 0;color:#9ca3af}
.no-results-icon{font-size:40px;margin-bottom:14px}
.no-results-text{font-size:14px}

/* ── Type mismatch info box ── */
.type-info{border:1px solid #e5e7eb;border-radius:10px;margin-bottom:16px;overflow:hidden;background:#fff}
.type-info-header{display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;user-select:none}
.type-info-header:hover{background:#f9fafb}
.type-info-icon{width:18px;height:18px;border-radius:50%;border:1.5px solid #6b7280;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#6b7280;flex-shrink:0;line-height:1}
.type-info-title{flex:1;font-size:13px;font-weight:600;color:#374151}
.type-info-chevron{width:16px;height:16px;color:#9ca3af;transition:transform .2s;flex-shrink:0}
.type-info.open .type-info-chevron{transform:rotate(180deg)}
.type-info-body{display:none;padding:0 14px 14px}
.type-info.open .type-info-body{display:block}
.type-info-desc{font-size:13px;color:#6b7280;line-height:1.5;margin-bottom:10px}
.type-mismatch-table{width:100%;border-collapse:collapse;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden}
.type-mismatch-table th{background:#f9fafb;padding:5px 10px;text-align:left;font-weight:600;color:#6b7280;border-bottom:1px solid #e5e7eb;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.type-mismatch-table td{padding:5px 10px;border-bottom:1px solid #f3f4f6;vertical-align:top;color:#374151}
.type-mismatch-table tr:last-child td{border-bottom:none}
.type-mismatch-table tr:hover td{background:#fafafa}
.type-mismatch-table td:first-child{font-family:'SF Mono',Consolas,monospace;font-size:11px;color:#1f2937;font-weight:600}
.type-mismatch-table .not-used{color:#9ca3af;font-style:italic}

/* ── Parameter types section ── */
.param-types-section{margin-top:10px;padding-top:4px;border-top:2px solid #e5e7eb}
.param-types-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px;background:transparent;border:none;border-bottom:1px solid #e5e7eb;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#374151;margin-bottom:2px}
.param-types-toggle:hover{color:#111827}
.pt-arrow{transition:transform .2s;color:#9ca3af;flex-shrink:0}
.param-types-wrap{display:none;margin-top:8px}
.param-types-wrap.open{display:block}
.param-types-table{width:100%;border-collapse:collapse;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden}
.param-types-table th{background:#f9fafb;padding:5px 10px;text-align:left;font-weight:600;color:#6b7280;border-bottom:1px solid #e5e7eb;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.param-types-table td{padding:5px 10px;border-bottom:1px solid #f3f4f6;vertical-align:top;color:#374151}
.param-types-table tr:last-child td{border-bottom:none}
.param-types-table tr:hover td{background:#fafafa}
.param-types-table td:first-child{font-family:'SF Mono',Consolas,monospace;font-size:11px;color:#1f2937;width:26%}
.param-types-table td:nth-child(2){width:22%}
.param-types-table td:nth-child(3){color:#6b7280}
.info-sec-intro{font-size:13px;color:#4b5563;margin:0 0 10px;line-height:1.5}
.field-subsection-hdr td{padding:4px 0 !important;border:none !important;background:transparent !important}
.field-subsection-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:5px 10px;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;color:#374151;text-align:left;letter-spacing:.03em;text-transform:uppercase}
.field-subsection-btn:hover{background:#e9eaec;color:#111827}
.field-subsection-intro-cell{font-size:12px;color:#6b7280;font-style:italic;padding:6px 10px !important}

/* ── Card meta badges ── */
.badge-updated{display:inline-flex;align-items:center;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:500;white-space:nowrap;background:#f3f4f6;color:#9ca3af}
.badge-auth{display:inline-flex;align-items:center;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:500;white-space:nowrap;background:#e2e8f0;color:#475569}

/* ── Copy path button ── */
.copy-btn{padding:1px 7px;border:1px solid #e5e7eb;border-radius:3px;background:#fafafa;font-size:10px;color:#9ca3af;cursor:pointer;font-family:inherit;transition:all .15s;flex-shrink:0;margin-left:auto;line-height:1.6}
.copy-btn:hover{border-color:#d1d5db;color:#6b7280;background:#f3f4f6}
.copy-btn.copied{border-color:#86efac;background:#f0fdf4;color:#166534}

@media(max-width:640px){
  .header{padding:8px 12px}
  .tabs,.stats,.content{padding-left:12px;padding-right:12px}
  .ep-path-row{display:none}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="header-logo">4</div>
    <span class="header-title">Fourth API Explorer</span>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/>
    </svg>
    <input class="search-input" id="search" type="search" placeholder="Search APIs, endpoints, fields…" autocomplete="off">
  </div>
</header>

<div class="tabs" id="tabs"></div>
<div class="product-filter" id="product-filter"></div>
<div class="stats" id="stats"></div>
<main class="content" id="content"></main>

<script>
// ─────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────

const EXPOSURE_META = {
  open:   { label:'Open',            cardCls:'exp-open',   badgeCls:'exp-open-badge'   },
  emp:    { label:'Employee-facing', cardCls:'exp-emp',    badgeCls:'exp-emp-badge'    },
  int:    { label:'Internal',        cardCls:'exp-int',    badgeCls:'exp-int-badge'    },
  client: { label:'Client library',  cardCls:'exp-client', badgeCls:'exp-client-badge' },
};

const AUTH_META = {
  'onboarding-public':   'JWT',
  'ess':                 'Custom header',
  'peoplesystem':        'Org-scoped',
  'onboarding-internal': 'JWT + API Key',
  'peoplesystem-gateway':'JWT',
  'auth-token':          'Client credentials',
  'iq-hcm':              'Service Bus',
  'iq360':               'Bearer / Basic',
  'reporting':           'Token param',
  'hmrc-submission':     'Internal',
  'audit-apis':          'Internal',
  'legacy-peoplesystem': 'Service header',
  'lp-sync':             'Internal',
  'iq-wfm':             'Custom header',
  'bi-webapi':          'Subdomain',
  'scheduling':         'Custom header',
  'hr-webapi':          'Subdomain',
  'tna-webapi':         'Org GUID or subdomain',
  'additional-payment-webapi': 'Subdomain',
  'sales-labour-modeling': 'Internal',
};

const TABS = [
  {id:'open', label:'Open APIs'},
  {id:'int',  label:'Internal APIs'},
];

const R='required', O='optional', RO='readonly', S='system', C='conditional';
function f(name,type,desc){return{name,type,desc};}
function sf(name,type,desc){return{name,type,desc,sub:true};}
function note(txt){return{name:txt,type:'note',desc:''};}
function section(name){return{name,type:'section',desc:''};}
function pt(param,type,notes){return{param,type,notes};}
function rf(name,type,desc){return{name,type,desc};}

// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────

const APIS = [

  // ── API 1: Onboarding Public API ──────────
  {
    id:'onboarding-public',
    title:'Onboarding Public API',
    area:'onboarding',
    exposure:'open',
    icon:'👤',
    subtitle:'The externally accessible Onboarding API — manage requests, candidates, documents and brands via the Layer7 gateway',
    exposeNote:'Open via Layer7 API gateway — accessible to customers and ATS partners. Create Request and Upload Document use multipart form-data; Create and Update Candidate use JSON.',
    infoSections:[
      {id:'error-codes',name:'Error codes',type:'errorCodes',rows:[
        {code:'200',status:'OK',desc:'Request succeeded'},
        {code:'400',status:'Bad Request',desc:'Incorrect authentication token or invalid request'},
        {code:'401',status:'Unauthorised',desc:'Token has expired or is missing'},
        {code:'404',status:'Not Found',desc:'Onboarding request, brand or customer not found'},
        {code:'422',status:'Unprocessable Entity',desc:'Organisation not found'},
      ]},
      {id:'webhook-callback',name:'Webhook callback',type:'fields',
       intro:'When a CallbackUrl is provided on Create Request, Onboarding will POST to it whenever the candidate status changes. The callback body contains these fields:',
       fields:[
        {name:'RequestId',type:'Text',desc:'The onboarding request GUID'},
        {name:'CandidateStatus',type:'Text',desc:'The current status of the candidate'},
        {name:'ESignInProgress',type:'True/False',desc:'Whether e-sign has started'},
        {name:'ESignCompleted',type:'True/False',desc:'Whether e-sign is complete'},
        {name:'OnboardingCompleted',type:'True/False',desc:'Whether the full onboarding is complete'},
        {name:'EmployeeCreationFailed',type:'True/False',desc:'Whether the HR employee creation failed'},
        {name:'Description',type:'Text',desc:'Error message if EmployeeCreationFailed is true'},
      ]},
      {id:'candidate-url',name:'Candidate registration URL',type:'text',
       content:'Once a candidate is created they receive an SMS with a shortened link. The full URL format for use in the hiring manager UI is: https://app.onbrd.me?requestId={RequestId}&orgAlias={OrgAlias}'},
    ],
    groups:[
      {
        name:'Brands',
        endpoints:[
          {
            method:'GET',name:'Get all brands',
            desc:'List all brands configured for an organisation',
            path:'GET /Brand/GetAll',
            fields:[f('orgAlias',R,'Short name identifying the organisation')]
          },
          {
            method:'POST',name:'Create brand',
            desc:'Set up a branded onboarding experience for a business unit',
            path:'POST /Brand/{org}/Create',
            fields:[
              f('OrgAlias',R,'Short name identifying the organisation'),
              f('BrandName',R,'Full display name shown to candidates'),
              f('PrimaryColour',R,'Main brand colour used throughout onboarding'),
              f('SmsSenderName',R,'Name that appears when SMS messages are sent to candidates'),
              f('Logo',O,'URL or path to the brand logo image'),
              f('IsActive',O,'Whether this brand is live and in use — defaults to active'),
              f('BothEmergencyContactsMandatory',O,'Whether candidates must provide two emergency contacts'),
              f('ReferencesMandatory',O,'How many references candidates must provide: 0, 1, or 2'),
              f('IsDiversityandInclusionRequired',O,'Whether candidates must complete the diversity section'),
            ]
          },
          {
            method:'POST',name:'Update brand',
            desc:'Update branding configuration for an organisation',
            path:'POST /Brand/{org}/update',
            fields:[
              f('OrgAlias',R,'Short name identifying the organisation'),
              f('BrandName',R,'Full display name shown to candidates'),
              f('PrimaryColour',R,'Main brand colour used throughout onboarding'),
              f('SmsSenderName',R,'Name that appears when SMS messages are sent to candidates'),
              f('Logo',O,'URL or path to the brand logo image'),
              f('IsActive',O,'Whether this brand is live and in use — defaults to active'),
              f('BothEmergencyContactsMandatory',O,'Whether candidates must provide two emergency contacts'),
              f('ReferencesMandatory',O,'How many references candidates must provide: 0, 1, or 2'),
              f('IsDiversityandInclusionRequired',O,'Whether candidates must complete the diversity section'),
            ]
          },
          {
            method:'POST',name:'Upload brand logo',
            desc:'Add or replace the logo image for a brand',
            path:'POST /Brand/{org}/{alias}/UploadLogo',
            fields:[f('file',R,'The logo image file to upload')]
          },
        ]
      },
      {
        name:'Requests',
        endpoints:[
          {
            method:'POST',name:'Create request',
            desc:'Initiate a new onboarding request for a candidate. The server generates and returns the RequestId — store this to use in subsequent calls. Sent as multipart form-data.',
            path:'POST /Request/create',
            fields:[
              f('OrgAlias',R,'Short name identifying the organisation'),
              f('BrandAlias',R,'The alias of the brand to use for this onboarding journey'),
              f('CallbackUrl',O,'Webhook URL to receive status change notifications — see Webhook callback info tab for payload details'),
            ]
          },
          {
            method:'GET',name:'Get request',
            desc:'Retrieve the current status and details of an onboarding request',
            path:'GET /Request/Get',
            fields:[
              f('orgAlias',R,'Short name identifying the organisation'),
              f('requestId',R,'The onboarding request GUID returned by Create request'),
            ]
          },
          {
            method:'PATCH',name:'Pause request',
            desc:'Pause an active onboarding request — the candidate will not be able to continue until unpaused',
            path:'PATCH /Request/Pause',
            fields:[
              f('orgAlias',R,'Short name identifying the organisation'),
              f('requestId',R,'The onboarding request GUID to pause'),
            ]
          },

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function countEndpoints(api){
  return api.groups.reduce((n,g)=>n+g.endpoints.length,0);
}

function matchesFilter(api){
  if(activeFilter==='open') return api.exposure==='open';
  if(activeFilter==='int')  return api.exposure==='int';
  return false;
}

function matchesSearch(api,q){
  if(!q) return true;
  const lq=q.toLowerCase();
  if(api.title.toLowerCase().includes(lq)||api.subtitle.toLowerCase().includes(lq)) return true;
  for(const g of api.groups){
    if(g.name.toLowerCase().includes(lq)) return true;
    for(const ep of g.endpoints){
      if(ep.name.toLowerCase().includes(lq)||ep.desc.toLowerCase().includes(lq)||ep.path.toLowerCase().includes(lq)) return true;
      for(const fd of ep.fields){
        if(fd.name.toLowerCase().includes(lq)||fd.desc.toLowerCase().includes(lq)) return true;
      }
      const resData=RESPONSE_FIELDS[api.id+'|'+ep.name];
      if(resData){
        if(resData.note&&resData.note.toLowerCase().includes(lq)) return true;
        for(const fd of (resData.fields||[])){
          if(fd.name.toLowerCase().includes(lq)||fd.desc.toLowerCase().includes(lq)) return true;
        }
      }
    }
  }
  return false;
}

function expBadge(exp){
  const m=EXPOSURE_META[exp]||EXPOSURE_META.int;
  return `<span class="badge-exp ${m.badgeCls}">${esc(m.label)}</span>`;
}

function methodBadge(method){
  return `<span class="method m-${method}">${method}</span>`;
}

function fieldBadge(type){
  const MAP={required:['f-required','Required'],optional:['f-optional','Optional'],readonly:['f-readonly','Read only'],system:['f-system','System'],conditional:['f-conditional','Conditional']};
  const [cls,label]=MAP[type]||MAP.optional;
  return `<span class="badge-field ${cls}">${label}</span>`;
}

  const cur=productFilters[activeFilter];
  document.getElementById('product-filter').innerHTML=
    `<button class="prod-btn${cur==='all'?' active':''}" onclick="setProduct('all')">All products</button>`+
    `<button class="prod-btn${cur==='hcm'?' active':''}" onclick="setProduct('hcm')">HCM UK</button>`+
    `<button class="prod-btn${cur==='wfm'?' active':''}" onclick="setProduct('wfm')">WFM UK</button>`;
}

function setProduct(p){
  productFilters[activeFilter]=p;
  render();
}

function renderStats(visible){
  const totalEp=visible.reduce((n,a)=>n+countEndpoints(a),0);
  document.getElementById('stats').innerHTML=`
    <div class="stat-item"><span class="stat-count">${visible.length}</span>&nbsp;APIs</div>
    <span class="stat-sep">·</span>
    <div class="stat-item"><span class="stat-count">${totalEp}</span>&nbsp;endpoints</div>
  `;
}

const FD_GUID  = new Set(['submissionId','batchHeaderId','CorrelationId'].map(s=>s.toLowerCase()));
const FD_INT   = new Set(['groupId','clientId','companyId','empId','id','yearid','locationid','iqid','payRunId','sncpEmpId','sppEmployeeId','salaryRequestId','employeePaymentId','taxyear','payperiod','employeepaybasisid','essHolidayRequestId','DivisionId','LocationID','JobTitleID','EmployeeID','PayrollID'].map(s=>s.toLowerCase()));
const FD_BOOL  = new Set(['delta','showFormer','IsActive','IsPaused','IsCompleted','Paid','HalfDay','Unpaid','PaidByRota','IncludedInRota','IsLeaver','CasualStaff','CanEdit','CanBookHalfDay','IsDisabled','HasDependents'].map(s=>s.toLowerCase()));
const FD_DTIME = new Set(['CreatedAt','CompletedAt','eventTimestamp','processedAt'].map(s=>s.toLowerCase()));
const FD_DATE  = new Set(['dateFrom','dateTo','StartDate','EndDate','DateOfBirth','TerminationDate','RequestDate','ProcessingDate','ShiftDate','PayDate','HolidayYearStartDate'].map(s=>s.toLowerCase()));
const FD_NUM   = new Set(['Value','Units','Rate','Amount','RateOfPay','AnnualSalary','ContractHours','TotalHours','RemainingHoliday','Allowed','Taken','Booked','Remaining','Accrued','NetPay','CurrentGrossPay','TotalGrossPayToDate','DayRate','AvgHoursPerWeek'].map(s=>s.toLowerCase()));
function fieldDataType(name){
  for(const p of name.split('/').map(s=>s.trim().toLowerCase())){
    if(FD_GUID.has(p))  return 'GUID';
    if(FD_INT.has(p))   return 'Integer';
    if(FD_BOOL.has(p))  return 'True / False';
    if(FD_DTIME.has(p)) return 'Date & time';
    if(FD_DATE.has(p))  return 'Date';
    if(FD_NUM.has(p))   return 'Number';
  }
  return 'Text';
}

function renderEndpoint(ep,uid,apiId){
  const reqFields=ep.fields||[];
  const resData=RESPONSE_FIELDS[(apiId||'')+'|'+ep.name]||{};
  const resFields=resData.fields||[];
  const resNote=resData.note||'';
  const hasContent=reqFields.length||resFields.length||resNote;

  const reqHtml=reqFields.map((fd,idx)=>{
    if(fd.type==='note') return `<tr class="field-note-row"><td colspan="4">${esc(fd.name)}</td></tr>`;
    if(fd.type==='section') return `<tr class="field-section-row"><td colspan="4">${esc(fd.name)}</td></tr>`;
    if(fd.type==='subsection'){
      const sid=`${uid}-ss${idx}`;
      const introRow=fd.intro?`<tr data-ss="${sid}" style="display:none"><td colspan="4" class="field-subsection-intro-cell">${esc(fd.intro)}</td></tr>`:'';
      const subRows=(fd.fields||[]).map(sfd=>`<tr data-ss="${sid}" style="display:none"><td><span class="field-name">${esc(sfd.name)}</span></td><td>Text</td><td>${fieldBadge(sfd.type)}</td><td class="field-desc">${esc(sfd.desc)}</td></tr>`).join('');
      return `<tr class="field-subsection-hdr"><td colspan="4"><button class="field-subsection-btn" onclick="toggleFieldSubsection('${sid}')">${esc(fd.name)}<svg id="ssa-${sid}" class="pt-arrow" width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg></button></td></tr>${introRow}${subRows}`;
    }
    const subCls=fd.sub?' field-sub-row':'';
    return `<tr class="${subCls}"><td><span class="field-name">${esc(fd.name)}</span></td><td>${fieldDataType(fd.name)}</td><td>${fieldBadge(fd.type)}</td><td class="field-desc">${esc(fd.desc)}</td></tr>`;
  }).join('');

  const resHtml=resFields.map(fd=>
    `<tr><td><span class="field-name">${esc(fd.name)}</span></td><td>${esc(fd.type)}</td><td class="field-desc">${esc(fd.desc)}</td></tr>`
  ).join('');

  const fieldsBlock=hasContent?`
    <div class="ep-tabs">
      <button class="ep-tab" onclick="switchTab('${uid}','req',this)">Request fields</button>
      <button class="ep-tab" onclick="switchTab('${uid}','res',this)">Response fields</button>
    </div>
    <div class="fields-wrap" id="${uid}-req">
      ${reqFields.length?`<table class="fields-table"><thead><tr><th>Field name</th><th>Type</th><th>Required</th><th>Description</th></tr></thead><tbody>${reqHtml}</tbody></table>`:'<p class="fields-empty">No request fields for this endpoint.</p>'}
    </div>
    <div class="fields-wrap" id="${uid}-res">
      ${resNote?`<div class="response-note">${esc(resNote)}</div>`:''}
      ${resFields.length?`<table class="fields-table fields-table-res"><thead><tr><th>Field name</th><th>Type</th><th>Description</th></tr></thead><tbody>${resHtml}</tbody></table>`:(!resNote?'<p class="fields-empty">No structured response fields defined.</p>':'')}
    </div>`:'';

  return `
    <div class="endpoint">
      <div class="ep-row">
        ${methodBadge(ep.method)}
        <div class="ep-info">
          <div class="ep-name">${esc(ep.name)}</div>
          <div class="ep-desc">${esc(ep.desc)}</div>
          <div class="ep-path-row">
            <span class="ep-path">${esc(ep.path)}</span>
            <button class="copy-btn" data-path="${esc(ep.path)}" onclick="copyPath(this)">Copy</button>
          </div>
        </div>
      </div>
      ${fieldsBlock}
    </div>`;
}

function renderParamTypes(api){
  if(!api.paramTypes) return '';
  const rows=api.paramTypes.map(p=>`
            <tr>
              <td>${esc(p.param)}</td>
              <td>${esc(p.type)}</td>
              <td>${esc(p.notes)}</td>
            </tr>`).join('');
  return `
    <div class="param-types-section">
      <button class="param-types-toggle" onclick="toggleParamTypes('${api.id}')">
        Parameter types &amp; formats
        <svg id="pta-${api.id}" class="pt-arrow" width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
      </button>
      <div class="param-types-wrap" id="pt-${api.id}">
        <table class="param-types-table">
          <thead><tr><th>Parameter</th><th>Type</th><th>Notes</th></tr></thead>
          <tbody>${rows}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderInfoSections(api){
  if(!api.infoSections||!api.infoSections.length) return '';
  return api.infoSections.map(sec=>{
    const uid=api.id+'-is-'+sec.id;
    let bodyHtml='';
    if(sec.type==='errorCodes'){
      const rows=sec.rows.map(r=>`<tr><td>${esc(r.code)}</td><td>${esc(r.status)}</td><td class="field-desc">${esc(r.desc)}</td></tr>`).join('');
      bodyHtml=`<table class="param-types-table"><thead><tr><th>Code</th><th>Status</th><th>Description</th></tr></thead><tbody>${rows}</tbody></table>`;
    } else if(sec.type==='fields'){
      const intro=sec.intro?`<p class="info-sec-intro">${esc(sec.intro)}</p>`:'';
      const rows=sec.fields.map(fd=>`<tr><td><span class="field-name">${esc(fd.name)}</span></td><td>${esc(fd.type)}</td><td class="field-desc">${esc(fd.desc)}</td></tr>`).join('');
      bodyHtml=intro+`<table class="param-types-table"><thead><tr><th>Field name</th><th>Type</th><th>Description</th></tr></thead><tbody>${rows}</tbody></table>`;
    } else if(sec.type==='text'){
      bodyHtml=`<p class="info-sec-intro">${esc(sec.content)}</p>`;
    }
    return `
      <div class="param-types-section">
        <button class="param-types-toggle" onclick="toggleInfoSection('${api.id}','${sec.id}')">
          ${esc(sec.name)}
          <svg id="isa-${uid}" class="pt-arrow" width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg>
        </button>
        <div class="param-types-wrap" id="is-${uid}">
          ${bodyHtml}
        </div>
      </div>`;
  }).join('');
}

function toggleInfoSection(apiId,sectionId){
  const uid=apiId+'-is-'+sectionId;
  const wrap=document.getElementById('is-'+uid);
  const arrow=document.getElementById('isa-'+uid);
  if(!wrap) return;
  const open=wrap.classList.toggle('open');
  if(arrow) arrow.style.transform=open?'rotate(180deg)':'';
}

function toggleFieldSubsection(sid){
  const rows=document.querySelectorAll(`[data-ss="${sid}"]`);
  const arrow=document.getElementById('ssa-'+sid);
  if(!rows.length) return;
  const open=rows[0].style.display==='none';
  rows.forEach(r=>r.style.display=open?'':'none');
  if(arrow) arrow.style.transform=open?'rotate(180deg)':'';
}

function renderApi(api,autoOpen){
  const epCount=countEndpoints(api);
  const m=EXPOSURE_META[api.exposure]||EXPOSURE_META.int;
  const auth=AUTH_META[api.id];
  const infoHtml=renderInfoSections(api);
  const groupsHtml=api.groups.map((g,gi)=>
    `<div class="group-heading">${esc(g.name)}</div>`+
    g.endpoints.map((ep,ei)=>renderEndpoint(ep,`${api.id}-g${gi}e${ei}`,api.id)).join('')
  ).join('');

  return `
    <div class="api-card ${m.cardCls}${autoOpen?' open':''}" id="card-${api.id}">
      <div class="api-header" onclick="toggleCard('${api.id}')">
        <div class="api-icon">${api.icon}</div>
        <div class="api-meta">
          <div class="api-title-row">
            <span class="api-title">${esc(api.title)}</span>
            ${expBadge(api.exposure)}
            <span class="badge-updated">Last updated: ${esc(api.lastUpdated||'April 2026')}</span>
            ${auth?`<span class="badge-auth">Auth: ${esc(auth)}</span>`:''}
          </div>
          <div class="api-subtitle">${esc(api.subtitle)}</div>
          <div class="api-expose-note">${esc(api.exposeNote)}</div>
        </div>
        <div class="api-right">
          <span class="ep-count">${epCount} endpoint${epCount!==1?'s':''}</span>
          <svg class="chevron" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
          </svg>
        </div>
      </div>
      <div class="api-body">${infoHtml}${groupsHtml}${renderParamTypes(api)}</div>
    </div>`;
}

function renderTypeMismatchWarning(){
  return `
  <div class="type-info" id="type-mismatch-box">
    <div class="type-info-header" onclick="toggleTypeMismatch()">
      <span class="type-info-icon">i</span>
      <span class="type-info-title">Type mismatches between APIs</span>
      <svg class="type-info-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 6 8 10 12 6"/></svg>
    </div>
    <div class="type-info-body">
      <p class="type-info-desc">Several parameters share the same name across different APIs but expect different data types. This is a known source of integration bugs &mdash; always check the type carefully before building requests.</p>
      <table class="type-mismatch-table">
        <thead>
          <tr><th>Parameter</th><th>Integration API</th><th>Gateway</th><th>Non-Sticky ASP.NET</th></tr>
        </thead>
        <tbody>
          <tr><td>clientId</td><td>String</td><td>Integer</td><td>Integer</td></tr>
          <tr><td>clientAccessID</td><td>String</td><td>Integer</td><td class="not-used">Not used</td></tr>
          <tr><td>parentModuleID</td><td>String</td><td>Integer</td><td class="not-used">Not used</td></tr>
          <tr><td>dateFrom / dateTo</td><td>String (YYYY-MM-DD)</td><td>Date and time</td><td>Date and time</td></tr>
          <tr><td>locationid on iQ Settings</td><td>String (PS_##_##)</td><td class="not-used">Not used</td><td>Integer</td></tr>
        </tbody>
      </table>
    </div>
  </div>`;
}

function toggleTypeMismatch(){
  document.getElementById('type-mismatch-box').classList.toggle('open');
}

function render(){
  const pf=productFilters[activeFilter];
  const tabVisible=APIS.filter(a=>matchesFilter(a)&&matchesSearch(a,searchQuery));
  let hcmApis, wfmApis;
  if(pf==='hcm'){
    hcmApis=tabVisible.filter(a=>HCM_AREAS.has(a.area));
    wfmApis=[];
  } else if(pf==='wfm'){
    hcmApis=[];
    wfmApis=tabVisible.filter(a=>a.area==='wfm');
  } else {
    hcmApis=tabVisible.filter(a=>HCM_AREAS.has(a.area));
    wfmApis=tabVisible.filter(a=>a.area==='wfm');
  }
  const visible=[...hcmApis,...wfmApis];
  const autoOpen=searchQuery.length>0;
  renderTabs();
  renderStats(visible);
  const content=document.getElementById('content');
  if(!visible.length){
    content.innerHTML=`
      <div class="no-results">
        <div class="no-results-icon">🔍</div>
        <div class="no-results-text">No APIs match your search or filter.</div>
      </div>`;
  } else {
    const warning=activeFilter==='int'&&hcmApis.length?renderTypeMismatchWarning():'';
    let html='';
    if(hcmApis.length) html+=`<div class="section-header">HCM UK</div>`+warning+hcmApis.map(a=>renderApi(a,autoOpen)).join('');
    if(wfmApis.length) html+=`<div class="section-header">WFM UK</div>`+wfmApis.map(a=>renderApi(a,autoOpen)).join('');
    content.innerHTML=html;
  }
}

// ─────────────────────────────────────────────
// INTERACTIONS
// ─────────────────────────────────────────────

function setFilter(id){
  activeFilter=id;
  render();
}

function toggleCard(id){
  const card=document.getElementById('card-'+id);
  if(card) card.classList.toggle('open');
}

function copyPath(btn){
  const path=btn.dataset.path;
  navigator.clipboard.writeText(path).then(()=>{
    btn.textContent='✓ Copied';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('copied');},1500);
  }).catch(()=>{});
}

function toggleFields(uid,btn){
  const wrap=document.getElementById(uid);
  if(!wrap) return;
  const open=wrap.classList.toggle('open');
  btn.textContent=open?'Hide fields':'Show fields';
}

function switchTab(uid,tab,btn){
  const reqWrap=document.getElementById(uid+'-req');
  const resWrap=document.getElementById(uid+'-res');
  const allBtns=btn.parentElement.querySelectorAll('.ep-tab');
  const isActive=btn.classList.contains('active');
  allBtns.forEach(b=>b.classList.remove('active'));
  if(reqWrap) reqWrap.classList.remove('open');
  if(resWrap) resWrap.classList.remove('open');
  if(!isActive){
    btn.classList.add('active');
    const target=tab==='req'?reqWrap:resWrap;
    if(target) target.classList.add('open');
  }
}

function toggleParamTypes(id){
  const wrap=document.getElementById('pt-'+id);
  const arrow=document.getElementById('pta-'+id);
  if(!wrap) return;
  const open=wrap.classList.toggle('open');
  if(arrow) arrow.style.transform=open?'rotate(180deg)':'';
}

let searchTimer;
document.getElementById('search').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    searchQuery=e.target.value.trim();
    render();
  },150);
});

render();
</script>
