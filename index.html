<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fourth API Explorer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fff;color:#1a1a2e;font-size:14px;line-height:1.5}

/* ── Header ── */
.header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:10px 24px;display:flex;align-items:center;gap:16px}
.header-brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.header-logo{width:30px;height:30px;background:#0f4c81;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;flex-shrink:0}
.header-title{font-size:16px;font-weight:700;color:#111827}
.search-wrap{flex:1;max-width:420px;position:relative}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#9ca3af;pointer-events:none}
.search-input{width:100%;padding:7px 12px 7px 34px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s;color:#111827}
.search-input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.search-input::placeholder{color:#9ca3af}

/* ── Tabs ── */
.tabs{padding:0 24px;border-bottom:2px solid #e5e7eb;display:flex;gap:0;background:#fff}
.tab-btn{padding:14px 28px;border:none;border-bottom:3px solid transparent;background:transparent;color:#6b7280;font-size:15px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit;margin-bottom:-2px}
.tab-btn:hover{color:#111827}
.tab-btn.active{color:#111827;border-bottom-color:#111827}

/* ── Stats ── */
.stats{padding:8px 24px;border-bottom:1px solid #f3f4f6;display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:#fafafa}
.stat-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#6b7280}
.stat-count{font-weight:700;color:#111827;font-size:14px}
.stat-sep{color:#d1d5db}

/* ── Content ── */
.content{padding:18px 24px;max-width:1060px;margin:0 auto}

/* ── API Card ── */
.api-card{border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px;overflow:hidden;transition:box-shadow .15s}
.api-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.api-card.exp-open{border-left:3px solid #22c55e}
.api-card.exp-emp{border-left:3px solid #3b82f6}
.api-card.exp-int{border-left:3px solid #9ca3af}
.api-card.exp-client{border-left:3px solid #f59e0b}

.api-header{padding:13px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;background:#fafafa;user-select:none;transition:background .12s}
.api-header:hover{background:#f3f4f6}
.api-icon{font-size:22px;flex-shrink:0;width:34px;text-align:center}
.api-meta{flex:1;min-width:0}
.api-title-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.api-title{font-size:14px;font-weight:700;color:#111827}
.api-subtitle{font-size:12px;color:#6b7280;margin-top:2px}
.api-expose-note{font-size:11px;color:#9ca3af;margin-top:1px}
.api-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.ep-count{font-size:12px;color:#9ca3af;white-space:nowrap}
.chevron{width:16px;height:16px;color:#9ca3af;transition:transform .2s;flex-shrink:0}
.api-card.open .chevron{transform:rotate(180deg)}

/* ── Exposure badges ── */
.badge-exp{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.exp-open-badge{background:#dcfce7;color:#166534}
.exp-emp-badge{background:#dbeafe;color:#1e40af}
.exp-int-badge{background:#f3f4f6;color:#4b5563}
.exp-client-badge{background:#fef3c7;color:#92400e}

/* ── API Body ── */
.api-body{display:none;padding:0 16px 14px 16px}
.api-card.open .api-body{display:block}

/* ── Groups ── */
.group-heading{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;padding:12px 0 5px;border-bottom:1px solid #f3f4f6;margin-bottom:2px}

/* ── Endpoints ── */
.endpoint{padding:8px 0;border-bottom:1px solid #f9fafb}
.endpoint:last-child{border-bottom:none}
.ep-row{display:flex;align-items:flex-start;gap:9px}
.ep-info{flex:1;min-width:0}
.ep-name{font-size:13px;font-weight:600;color:#111827}
.ep-desc{font-size:12px;color:#6b7280;margin-top:1px}
.ep-path{font-family:'SF Mono',Consolas,monospace;font-size:11px;color:#9ca3af;margin-top:3px}

/* ── Method badges ── */
.method{display:inline-flex;align-items:center;justify-content:center;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:.04em;flex-shrink:0;min-width:52px;margin-top:2px}
.m-GET{background:#dcfce7;color:#166534}
.m-POST{background:#dbeafe;color:#1e40af}
.m-PATCH{background:#fef3c7;color:#92400e}
.m-PUT{background:#ccfbf1;color:#134e4a}
.m-DELETE{background:#fee2e2;color:#991b1b}
.m-EVENT{background:#ede9fe;color:#5b21b6}
.m-QUERY{background:#fce7f3;color:#9d174d}

/* ── Show fields toggle ── */
.toggle-fields{margin-top:6px;padding:3px 10px;border:1px solid #e5e7eb;border-radius:4px;background:#fff;font-size:11px;color:#6b7280;cursor:pointer;font-family:inherit;transition:all .15s}
.toggle-fields:hover{border-color:#3b82f6;color:#3b82f6}

/* ── Fields table ── */
.fields-wrap{display:none;margin-top:8px}
.fields-wrap.open{display:block}
.fields-table{width:100%;border-collapse:collapse;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;overflow:hidden}
.fields-table th{background:#f9fafb;padding:5px 10px;text-align:left;font-weight:600;color:#6b7280;border-bottom:1px solid #e5e7eb;font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.fields-table th:first-child{width:28%}
.fields-table th:nth-child(2){width:14%}
.fields-table td{padding:5px 10px;border-bottom:1px solid #f3f4f6;vertical-align:top;color:#374151}
.fields-table tr:last-child td{border-bottom:none}
.fields-table tr:hover td{background:#fafafa}
.field-name{font-family:'SF Mono',Consolas,monospace;font-size:11px;color:#1f2937}
.field-desc{font-size:12px;color:#6b7280}

/* ── Field badges ── */
.badge-field{display:inline-flex;align-items:center;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:600;white-space:nowrap}
.f-required{background:#dcfce7;color:#166534}
.f-optional{background:#f3f4f6;color:#6b7280}
.f-readonly{background:#dbeafe;color:#1e40af}
.f-system{background:#e2e8f0;color:#475569}

/* ── No results ── */
.no-results{text-align:center;padding:56px 0;color:#9ca3af}
.no-results-icon{font-size:40px;margin-bottom:14px}
.no-results-text{font-size:14px}

@media(max-width:640px){
  .header{padding:8px 12px}
  .tabs,.stats,.content{padding-left:12px;padding-right:12px}
  .ep-path{display:none}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="header-logo">4</div>
    <span class="header-title">Fourth API Explorer</span>
  </div>
  <div class="search-wrap">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
      <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/>
    </svg>
    <input class="search-input" id="search" type="search" placeholder="Search APIs, endpoints, fields…" autocomplete="off">
  </div>
</header>

<div class="tabs" id="tabs"></div>
<div class="stats" id="stats"></div>
<main class="content" id="content"></main>

<script>

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────

let activeFilter = 'open';
let searchQuery  = '';

// ─────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────

function esc(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function countEndpoints(api){
  return api.groups.reduce((n,g)=>n+g.endpoints.length,0);
}

function matchesFilter(api){
  if(activeFilter==='open') return api.exposure==='open';
  if(activeFilter==='int')  return api.exposure==='int';
  return false;
}

function matchesSearch(api,q){
  if(!q) return true;
  const lq=q.toLowerCase();
  if(api.title.toLowerCase().includes(lq)||api.subtitle.toLowerCase().includes(lq)) return true;
  for(const g of api.groups){
    if(g.name.toLowerCase().includes(lq)) return true;
    for(const ep of g.endpoints){
      if(ep.name.toLowerCase().includes(lq)||ep.desc.toLowerCase().includes(lq)||ep.path.toLowerCase().includes(lq)) return true;
      for(const fd of ep.fields){
        if(fd.name.toLowerCase().includes(lq)||fd.desc.toLowerCase().includes(lq)) return true;
      }
    }
  }
  return false;
}

// ─────────────────────────────────────────────
// RENDER HELPERS
// ─────────────────────────────────────────────

function expBadge(exp){
  const m=EXPOSURE_META[exp]||EXPOSURE_META.int;
  return `<span class="badge-exp ${m.badgeCls}">${esc(m.label)}</span>`;
}

function methodBadge(method){
  return `<span class="method m-${method}">${method}</span>`;
}

function fieldBadge(type){
  const MAP={required:['f-required','Required'],optional:['f-optional','Optional'],readonly:['f-readonly','Read only'],system:['f-system','System']};
  const [cls,label]=MAP[type]||MAP.optional;
  return `<span class="badge-field ${cls}">${label}</span>`;
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────

function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>`
    <button class="tab-btn${activeFilter===t.id?' active':''}" onclick="setFilter('${t.id}')">${esc(t.label)}</button>
  `).join('');
}

function renderStats(visible){
  const totalEp=visible.reduce((n,a)=>n+countEndpoints(a),0);
  document.getElementById('stats').innerHTML=`
    <div class="stat-item"><span class="stat-count">${visible.length}</span>&nbsp;APIs</div>
    <span class="stat-sep">·</span>
    <div class="stat-item"><span class="stat-count">${totalEp}</span>&nbsp;endpoints</div>
  `;
}

function renderEndpoint(ep,uid){
  const fieldsHtml=ep.fields.map(fd=>`
    <tr>
      <td><span class="field-name">${esc(fd.name)}</span></td>
      <td>${fieldBadge(fd.type)}</td>
      <td class="field-desc">${esc(fd.desc)}</td>
    </tr>`).join('');

  const fieldsBlock=ep.fields.length?`
    <button class="toggle-fields" onclick="toggleFields('${uid}',this)">Show fields</button>
    <div class="fields-wrap" id="${uid}">
      <table class="fields-table">
        <thead><tr><th>Field name</th><th>Required</th><th>Description</th></tr></thead>
        <tbody>${fieldsHtml}</tbody>
      </table>
    </div>`:'';

  return `
    <div class="endpoint">
      <div class="ep-row">
        ${methodBadge(ep.method)}
        <div class="ep-info">
          <div class="ep-name">${esc(ep.name)}</div>
          <div class="ep-desc">${esc(ep.desc)}</div>
          <div class="ep-path">${esc(ep.path)}</div>
        </div>
      </div>
      ${fieldsBlock}
    </div>`;
}

function renderApi(api,autoOpen){
  const epCount=countEndpoints(api);
  const m=EXPOSURE_META[api.exposure]||EXPOSURE_META.int;
  const groupsHtml=api.groups.map((g,gi)=>
    `<div class="group-heading">${esc(g.name)}</div>`+
    g.endpoints.map((ep,ei)=>renderEndpoint(ep,`${api.id}-g${gi}e${ei}`)).join('')
  ).join('');

  return `
    <div class="api-card ${m.cardCls}${autoOpen?' open':''}" id="card-${api.id}">
      <div class="api-header" onclick="toggleCard('${api.id}')">
        <div class="api-icon">${api.icon}</div>
        <div class="api-meta">
          <div class="api-title-row">
            <span class="api-title">${esc(api.title)}</span>
            ${expBadge(api.exposure)}
          </div>
          <div class="api-subtitle">${esc(api.subtitle)}</div>
          <div class="api-expose-note">${esc(api.exposeNote)}</div>
        </div>
        <div class="api-right">
          <span class="ep-count">${epCount} endpoint${epCount!==1?'s':''}</span>
          <svg class="chevron" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/>
          </svg>
        </div>
      </div>
      <div class="api-body">${groupsHtml}</div>
    </div>`;
}

function render(){
  const visible=APIS.filter(a=>matchesFilter(a)&&matchesSearch(a,searchQuery));
  const autoOpen=searchQuery.length>0;
  renderTabs();
  renderStats(visible);
  const content=document.getElementById('content');
  if(!visible.length){
    content.innerHTML=`
      <div class="no-results">
        <div class="no-results-icon">🔍</div>
        <div class="no-results-text">No APIs match your search or filter.</div>
      </div>`;
  } else {
    content.innerHTML=visible.map(a=>renderApi(a,autoOpen)).join('');
  }
}

// ─────────────────────────────────────────────
// INTERACTIONS
// ─────────────────────────────────────────────

function setFilter(id){
  activeFilter=id;
  render();
}

function toggleCard(id){
  const card=document.getElementById('card-'+id);
  if(card) card.classList.toggle('open');
}

function toggleFields(uid,btn){
  const wrap=document.getElementById(uid);
  if(!wrap) return;
  const open=wrap.classList.toggle('open');
  btn.textContent=open?'Hide fields':'Show fields';
}

let searchTimer;
document.getElementById('search').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    searchQuery=e.target.value.trim();
    render();
  },150);
});

render();
</script>
